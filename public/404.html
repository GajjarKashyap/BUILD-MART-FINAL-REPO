<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #FAFAFB;
            color: #111827;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 20px;
            padding: 56px 48px;
            max-width: 560px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #FEF3C7;
            color: #D97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px auto;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 32px;
            margin-bottom: 12px;
            color: #111827;
        }
        p {
            color: #6B7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary-custom {
            background: #111827;
            color: #FFFFFF;
        }
        .btn-primary-custom:hover {
            background: #2563EB;
            color: #FFFFFF;
        }
        .btn-outline-custom {
            background: #FAFAFB;
            color: #4B5563;
            border: 1px solid #E5E7EB;
        }
        .btn-outline-custom:hover {
            border-color: #D1D5DB;
            color: #111827;

    <div class="error-card">

        <div class="d-flex justify-content-center gap-3 flex-wrap">

            <a href="shop.html" class="btn-action btn-outline-custom">
